name: 功能建议
description: 描述使用场景与期望结果。
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你想完成什么，现在为什么不顺手？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你期望的交互或结果，不需要提供实现细节。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代方式
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有附上真实账号、Bucket、对象路径、AccessKey、Token 或签名 URL。
          required: true
